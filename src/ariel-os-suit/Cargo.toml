[package]
name = "ariel-os-suit"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.feature-groups]
transport.exactly-one = { features = ["coap", "http"] }

[dependencies]
# cose_minicbor = { workspace = true, features = [
#   "es256",
#   "sha256",
#   "suit-sha256-es256",
# ] }
defmt = { workspace = true, optional = true }
dress-up = { git = "https://github.com/anlavandier/dress-up/", rev = "a9d67a36ee7873053a5588dcc0877c439301a480", features = [
  "async",
], default-features = false }
generic-array = { workspace = true, features = ["const-default"] }
heapless = { workspace = true }
minicbor = { workspace = true }
uuid = { workspace = true }


featurecomb = { workspace = true }

ariel-os-log = { workspace = true }
ariel-os-device-update = { workspace = true }
ariel-os-update-transports = { workspace = true, optional = true }
ariel-os-embassy = { workspace = true, features = ["net"] }
embassy-net = { workspace = true, optional = true }

[features]
defmt = ["dep:defmt", "ariel-os-update-transports/defmt"]

http = ["ariel-os-update-transports/http", "embassy-net/tcp", "embassy-net/dns"]
coap = ["ariel-os-update-transports/coap", "embassy-net/dns"]

[lints]
workspace = true

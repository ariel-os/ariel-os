[package]
name = "ariel-os-log-transport-driver"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
ariel-os-hal = { workspace = true }
ariel-os-log = { workspace = true, features = ["custom-transport"] }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-usb = { workspace = true, optional = true }
embedded-io-async-07 = { package = "embedded-io-async", version = "0.7", optional = true }
esp-hal = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }

[features]
usb-cdc-acm-esp = ["dep:embassy-sync", "dep:esp-hal"]
logging-over-generic-usb = [
  "dep:embassy-futures",
  "dep:embassy-sync",
  "dep:embassy-usb",
  "dep:embedded-io-async-07",
  "dep:static_cell",
]

_test = []

[lints]
workspace = true

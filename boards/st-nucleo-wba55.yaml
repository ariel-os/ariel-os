version: 0.5.0
targets:
  # Pinout from <https://www.st.com/resource/en/schematic_pack/mb1803-wba55cga-b01-schematic.pdf>
  st-nucleo-wba55:
    chip: stm32wba55cg
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB4
        aliases:
          - LD1
        color: blue
      # led1
      - pin: PA9
        aliases:
          - LD2
        color: green
      # led2
      - pin: PB8
        aliases:
          - LD3
        color: red
    switches:
      # button0
      - pins: PC13
        resistors: none
        active: low
        aliases:
          - B1
      # button1
      - pins: PB6
        resistors: none
        active: low
        aliases:
          - B2
      # button2
      - pins: PB7
        resistors: none
        active: low
        aliases:
          - B3
    uarts:
      - aliases:
          - VCP1
        tx_pin: PB12
        rx_pin: PA8
        possible_peripherals: [USART1]
        host_facing: true

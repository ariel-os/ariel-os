version: 0.4.1
targets:
  espressif-esp32-c6-devkitc-1:
    chip: esp32-c6-wroom-1
    flags:
      - has_usb_cdc_acm_port
    buttons:
      # button0
      - pin: GPIO9
        active: low
    uarts:
      - tx_pin: GPIO16
        rx_pin: GPIO17
        possible_peripherals: [UART0]
        host_facing: true

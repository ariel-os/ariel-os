version: 0.5.0
targets:
  # Pinout for the buttons and LEDs from <https://www.st.com/resource/en/schematic_pack/mb1136-default-c04_schematic.pdf>
  st-nucleo-f401re:
    chip: stm32f401re
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
        color: green
        active: high
        aliases:
          - LD2
    buttons:
      # button0
      - pin: PC13
        resistor: pullup
        active: low
        aliases:
          - B1
          - USER
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA3
        possible_peripherals: [USART2]
        host_facing: true

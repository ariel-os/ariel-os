version: 0.5.0
targets:
  # Schematic found in appendix B of <https://pip-assets.raspberrypi.com/categories/610-raspberry-pi-pico/documents/RP-008307-DS-2-pico-datasheet.pdf>
  rpi-pico:
    chip: rp2040
    flags:
      - has_usb_device_port
    ariel:
      global_env:
        CHIP_NVM_SIZE_BYTES: $(2048 * 1024)
    leds:
      # led0
      - pin: PIN_25
        color: green
        active: high

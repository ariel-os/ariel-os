version: 0.5.0
targets:
  makerdiary-nrf52840-mdk:
    # Schematic <https://github.com/makerdiary/nrf52840-mdk/blob/master/docs/hardware/nrf52840-mdk-schematic_v1_0.pdf>
    chip: nrf52840
    leds:
      # led0
      - # note: this is the RGB LED red channel
        color: red
        pin: P0_23
        active: low
      # led1
      - # note: this is the RGB LED green channel
        color: green
        pin: P0_22
        active: low
      # led2
      - # note: this is the RGB LED blue channel
        color: blue
        pin: P0_24
        active: low
    switches:
      # button0
      - pins: P1_00
        active: low
        resistors: none # Could not find on the schematic
        aliases:
          - USR_BTN
          - SW2
    uarts:
      - tx_pin: P0_20
        rx_pin: P0_19
        possible_peripherals: [UARTE0, UARTE1]
        host_facing: true

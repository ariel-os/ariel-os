version: 0.4.0
targets:
  dwm3001cdk:
    chip: nrf52833
    flags:
      - has_usb_device_port
    leds:
      # led0
      - pin: P0_04
        aliases:
          - D9
        color: green
        active: low
      # led1
      - pin: P0_14
        aliases:
          - D12
        color: red
        active: low
      # led2
      - pin: P0_22
        aliases:
          - D11
        color: red
        active: low
      # led3
      - pin: P0_05
        aliases:
          - D10
        color: blue
        active: low
    buttons:
      # button0
      - pin: P0_02
        aliases:
          - SW2
        active: low

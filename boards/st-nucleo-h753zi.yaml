version: 0.4.1
targets:
  st-nucleo-h753zi:
    chip: stm32h753zi
    flags:
      - has_ethernet_stm32
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB0
        aliases:
          - LD1
        color: green
        active: high
      # led1
      - pin: PE1
        aliases:
          - LD2
        color: yellow
        active: high
      # led2
      - pin: PB14
        aliases:
          - LD3
        color: red
        active: high
    buttons:
      # button0
      - pin: PC13
    uarts:
      - aliases:
          - VCP
        tx_pin: PD8
        rx_pin: PD9
        possible_peripherals: [USART3]
        host_facing: true

version: 0.5.0
targets:
  # Pinout for the buttons and LEDs from <https://www.st.com/resource/en/schematic_pack/mb1717-c031c6-b02_schematic.pdf>
  st-nucleo-c031c6:
    chip: stm32c031c6
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
        color: green
        active: low
        aliases:
          - LD4
    buttons:
      # button0
      - pin: PC13
        resistor: pullup
        active: low
        aliases:
          - B1
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA3
        possible_peripherals: [USART2]
        host_facing: true

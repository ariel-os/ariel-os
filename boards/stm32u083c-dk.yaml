version: 0.5.0
targets:
  # Pinout from <https://www.st.com/resource/en/schematic_pack/mb1933-u083c-c02-schematic.pdf>
  stm32u083c-dk:
    chip: stm32u083mc
    flags:
      - has_usb_device_port
    ariel:
      # WWDG's interrupt is shared with IWDG's.
      swi: USART4_LPUART3
    leds:
      # led0
      - pin: PC13
        color: green
        active: high
        aliases:
          - LD3
          - LED_GREEN
      # led1
      - pin: PA5
        color: blue
        active: high
        aliases:
          - LD4
          - LED_BLUE
      # led2
      - pin: PB2
        color: red
        active: high
        aliases:
          - LD5
          - LED_RED
    buttons:
      # button0
      - pin: PC2
        resistor: pullup
        active: low
        aliases:
          - JOYSTICK_CENTER
    i2c:
      - sda_pin: PB7
        scl_pin: PB8
        possible_peripherals:
          - I2C1
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA3
        # TODO: add LPUART1 when supported by Ariel OS.
        possible_peripherals: [USART2]
        host_facing: true

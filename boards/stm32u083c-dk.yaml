version: 0.4.1
targets:
  stm32u083c-dk:
    chip: stm32u083mc
    flags:
      - has_usb_device_port
    ariel:
      # WWDG's interrupt is shared with IWDG's.
      swi: USART4_LPUART3
    leds:
      # led0
      - pin: PC13
        color: green
      # led1
      - pin: PA5
        color: blue
      # led2
      - pin: PB2
        color: red
    buttons:
      # button0
      - pin: PC2
    i2c:
      - sda_pin: PB7
        scl_pin: PB8
        possible_peripherals:
          - I2C1
    uarts:
      - tx_pin: PA2
        rx_pin: PA3
        possible_peripherals: [USART2]
        host_facing: true

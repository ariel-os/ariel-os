version: 0.5.0
targets:
  # Pinout for the switches and LEDs from the files found at <https://www.st.com/en/evaluation-tools/nucleo-g431rb.html#cad-resources>
  st-nucleo-g431rb:
    chip: stm32g431rb
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
        color: green
        active: high
    switches:
      # button0
      - pins: PC13
        active: low
        resistors: pullup
        aliases:
          - B1
          - USER
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA3
        possible_peripherals: [LPUART1, USART2]
        host_facing: true

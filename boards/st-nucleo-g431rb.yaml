version: 0.4.1
targets:
  st-nucleo-g431rb:
    chip: stm32g431rb
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
        color: green
        active: high
    buttons:
      # button0
      - pin: PC13

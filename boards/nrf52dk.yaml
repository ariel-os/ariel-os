version: 0.5.0
targets:
  nrf52dk:
    # Schematic in <https://docs.nordicsemi.com/viewer/book-attachment/baHwOVZu14GaxxPcvg~L_Q/4lvULL~ptfn4MsnQIVGfzg-baHwOVZu14GaxxPcvg~L_Q>
    chip: nrf52832
    leds:
      # led0
      - color: green
        pin: P0_17
        active: low
      # led1
      - color: green
        pin: P0_18
        active: low
      # led2
      - color: green
        pin: P0_19
        active: low
      # led3
      - color: green
        pin: P0_20

    buttons:
      # button0
      - pin: P0_13
        resistor: none
        active: low
        aliases:
          - SW1
          - BUTTON1
      # button1
      - pin: P0_14
        resistor: none
        active: low
        aliases:
          - SW2
          - BUTTON2
      # button2
      - pin: P0_15
        resistor: none
        active: low
        aliases:
          - SW3
          - BUTTON3
      # button3
      - pin: P0_16
        resistor: none
        active: low
        aliases:
          - SW4
          - BUTTON4
    # TODO: support for the TWI peripheral needs to be added to Ariel OS first.
    # i2c:
    #   # Only available when a shield is inserted.
    #   - sda_pin: P0_26
    #     scl_pin: P0_27
    #     possible_peripherals:
    #       - TWISPI0
    #       - TWISPI1
    uarts:
      - aliases:
          - VCOM0
        tx_pin: P0_06
        rx_pin: P0_08
        rts_pin: P0_05
        cts_pin: P0_07
        possible_peripherals: [UARTE0]
        host_facing: true

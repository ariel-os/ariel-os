version: 0.4.1
targets:
  espressif-esp32-s3-devkitc-1:
    chip: esp32-s3-wroom-1
    flags:
      - has_usb_cdc_acm_port
      - has_usb_device_port
    buttons:
      # button0
      - pin: GPIO0
        active: low
    uarts:
      - tx_pin: GPIO43
        rx_pin: GPIO44
        possible_peripherals: [UART0]
        host_facing: true

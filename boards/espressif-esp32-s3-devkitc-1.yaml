version: 0.5.0
targets:
  espressif-esp32-s3-devkitc-1:
    # Schematic <https://dl.espressif.com/dl/schematics/SCH_ESP32-S3-DevKitC-1_V1.1_20220413.pdf>
    chip: esp32-s3-wroom-1
    flags:
      - has_usb_cdc_acm_port
      - has_usb_device_port
    switches:
      # button0
      - pins: GPIO0
        active: low
        resistors: none
        aliases:
          - SW1
    uarts:
      - tx_pin: GPIO43
        rx_pin: GPIO44
        possible_peripherals: [UART0, UART1, UART2]
        host_facing: true

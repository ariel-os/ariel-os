version: 0.4.1
targets:
  arduino-uno-q:
    chip: stm32u585ai
    ariel:
      flags:
        - has_swi
      global_env:
        CARGO_ENV:
          - CONFIG_VBUS_DETECTION=false
          - CONFIG_SWI=WWDG
    leds:
      # led0
      - color: red
        pin: PH10
      # led1
      - color: green
        pin: PH11
      # led2
      - color: blue
        pin: PH12
      # led3
      - color: red
        pin: PH13
      # led4
      - color: green
        pin: PH14
      # led5
      - color: blue
        pin: PH15
    i2c:
      # These pins have strong pull-ups suitable for I2C.
      - sda_pin: PB11
        scl_pin: PB10
        possible_peripherals:
          - I2C2
        aliases:
          - ArduinoI2c
      - sda_pin: PD13
        scl_pin: PD12
        possible_peripherals:
          - I2C4
        aliases:
          - QwiicI2c
      # TODO: currently not allowed by sbd-gen because the peripheral is shared.
      # These pins have strong pull-ups suitable for I2C.
      # - sda_pin: PF15
      #   scl_pin: PF14
      #   possible_peripherals:
      #     - I2C4
      #   aliases:
      #     - JmiscI2c
    uarts:
      # Wired to the SoC.
      - tx_pin: PG7
        rx_pin: PG8
        rts_pin: PG6
        cts_pin: PG5
        possible_peripherals: [LPUART1]
        host_facing: true

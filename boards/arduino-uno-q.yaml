version: 0.5.0
targets:
  # Schematic <https://docs.arduino.cc/resources/schematics/ABX00162-schematics.pdf>
  arduino-uno-q:
    chip: stm32u585ai
    ariel:
      flags:
        - has_swi
      global_env:
        CARGO_ENV:
          - CONFIG_VBUS_DETECTION=false
          - CONFIG_SWI=WWDG
    leds:
      # led0
      - pin: PH10
        color: red
        active: low
      # led1
      - pin: PH11
        color: green
        active: low
      # led2
      - pin: PH12
        color: blue
        active: low
      # led3
      - pin: PH13
        color: red
        active: low
      # led4
      - pin: PH14
        color: green
        active: low
      # led5
      - pin: PH15
        color: blue
        active: low
    i2c:
      # These pins have strong pull-ups suitable for I2C.
      - sda_pin: PB11
        scl_pin: PB10
        possible_peripherals:
          - I2C2
        aliases:
          - ArduinoI2c
      - sda_pin: PD13
        scl_pin: PD12
        possible_peripherals:
          - I2C4
        aliases:
          - QwiicI2c
      # TODO: currently not allowed by sbd-gen because the peripheral is shared.
      # These pins have strong pull-ups suitable for I2C.
      # - sda_pin: PF15
      #   scl_pin: PF14
      #   possible_peripherals:
      #     - I2C4
      #   aliases:
      #     - JmiscI2c
    uarts:
      # Wired to the SoC.
      - tx_pin: PG7
        rx_pin: PG8
        rts_pin: PG6
        cts_pin: PG5
        possible_peripherals: [LPUART1]
        host_facing: true

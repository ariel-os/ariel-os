version: 0.4.0
targets:
  espressif-esp32-c61-devkitc-1-n8rx:
    chip: esp32-c61-wroom-1-n8rx
    flags:
      - has_usb_cdc_acm_port
    buttons:
      # button0 (BOOT)
      - pin: GPIO9
        active: low

  espressif-esp32-c61-devkitc-1-h16rx:
    chip: esp32-c61-wroom-1-h16rx
    flags:
      - has_usb_cdc_acm_port
    buttons:
      # button0 (BOOT)
      - pin: GPIO9
        active: low

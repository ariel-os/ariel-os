version: 0.5.0
targets:
  # Pinout from <https://www.st.com/resource/en/schematic_pack/steval-mkboxpro-schematic.pdf>
  st-steval-mkboxpro:
    chip: stm32u585ai
    flags:
      - has_usb_device_port
    ariel:
      flags:
        - has_swi
      global_env:
        CARGO_ENV:
          - CONFIG_VBUS_DETECTION=false
          - CONFIG_SWI=WWDG
    leds:
      # led0
      - pin: PF6
        aliases:
          - LED1
          - D5
        color: green
      # led1
      - pin: PH11
        aliases:
          - LED2
          - D6
        color: red
      # led2
      - pin: PH12
        aliases:
          - LED3
          - D7
        color: orange
      # led3
      - pin: PF9
        aliases:
          - USB_enum_LED
          - D10
        color: blue
    switches:
      # button0
      - pins: PC13
        active: high
        resistors: pulldown
        aliases:
          - BT1
          - SW1
      # button1
      - pins: PE0
        resistors: pulldown
        active: high
        aliases:
          - BT2
          - SW2
          - BOOT0
    i2c:
      - sda_pin: PB7
        scl_pin: PB6
        possible_peripherals:
          - I2C1
          - I2C4

version: 0.5.0
targets:
  espressif-esp32-devkitc:
    # Schematic <https://dl.espressif.com/dl/schematics/esp32_devkitc_v4_sch.pdf>
    chip: esp-wroom-32
    buttons:
      # button0
      - pin: GPIO0
        # The NPN transistor pulls to DTR (an active-low signal) when RTS is
        # high (also an active-low signal); however when RTS is low the pin
        # is left floating, which still calls for enabling the internal pull-up.
        resistor: none
        active: low
        aliases:
          - SW1
    uarts:
      - tx_pin: GPIO1
        rx_pin: GPIO3
        possible_peripherals: [UART0, UART1, UART2]
        host_facing: true

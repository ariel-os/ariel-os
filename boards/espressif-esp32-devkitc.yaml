version: 0.5.0
targets:
  espressif-esp32-devkitc:
    # Schematic <https://dl.espressif.com/dl/schematics/esp32_devkitc_v4_sch.pdf>
    chip: esp-wroom-32
    switches:
      # button0
      - pins: GPIO0
        active: low
        resistors: none
        aliases:
          - SW1
    uarts:
      - tx_pin: GPIO1
        rx_pin: GPIO3
        possible_peripherals: [UART0, UART1, UART2]
        host_facing: true

version: 0.5.0
targets:
  # Pinout from <https://www.st.com/en/evaluation-tools/nucleo-wba65ri.html#cad-resources>
  st-nucleo-wba65ri:
    chip: stm32wba65ri
    flags:
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PD8
        color: blue
        active: low
        aliases:
          - LD1
      # led1
      - pin: PC4
        color: green
        active: low
        aliases:
          - LD2
      # led2
      - pin: PB8
        color: red
        active: low
        aliases:
          - LD3
    buttons:
      # button0
      - pin: PC13
        resistor: none
        active: low
        aliases:
          - B1
      # button1
      - pin: PC5
        resistor: none
        active: low
        aliases:
          - B2
      # button2
      - pin: PB4
        resistor: none
        active: low
        aliases:
          - B3
    uarts:
      - aliases:
          - VCP1
        tx_pin: PB12
        rx_pin: PA8
        possible_peripherals: [USART1]
        host_facing: true

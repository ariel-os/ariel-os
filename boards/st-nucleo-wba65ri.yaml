version: 0.5.0
targets:
  # Pinout from <https://www.st.com/en/evaluation-tools/nucleo-wba65ri.html#cad-resources>
  st-nucleo-wba65ri:
    chip: stm32wba65ri
    flags:
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PD8
        aliases:
          - LD1
        color: blue
      # led1
      - pin: PC4
        aliases:
          - LD2
        color: green
      # led2
      - pin: PB8
        aliases:
          - LD3
        color: red
    switches:
      # button0
      - pins: PC13
        resistors: none
        active: low
        aliases:
          - B1
      # button1
      - pins: PC5
        resistors: none
        active: low
        aliases:
          - B2
      # button2
      - pins: PB4
        resistors: none
        active: low
        aliases:
          - B3
    uarts:
      - aliases:
          - VCP1
        tx_pin: PB12
        rx_pin: PA8
        possible_peripherals: [USART1]
        host_facing: true

version: 0.5.0
targets:
  # Pinout for the buttons and LEDs from <https://files.seeedstudio.com/wiki/SeeedStudio-XIAO-ESP32C6/XIAO-ESP32-C6_v1.0_SCH_PDF_24028.pdf>
  seeedstudio-xiao-esp32c6:
    chip: esp32c6fx4
    flags:
      - has_usb_cdc_acm_port
    leds:
      # led0
      - pin: GPIO15
        color: yellow
        active: low
        aliases:
          - D4
          - USER_LED
    buttons:
      # button0
      - pin: GPIO9
        resistor: pullup
        active: low
        aliases:
          - BOOT

version: 0.5.0
targets:
  # Pinout from <https://github.com/rroels/ulanzi_tc001_hardware>
  ulanzi-tc001:
    chip: esp32-wroom-32d
    switches:
      # button0
      - pins: GPIO26
        active: low
        resistors: none
        aliases:
          - left
      # button1
      - pins: GPIO27
        active: low
        resistors: none
        aliases:
          - middle
      # button2
      - pins: GPIO14
        active: low
        resistors: none
        aliases:
          - right
    quirks:
      - type: set_pin
        description: turn off buzzer
        pin: GPIO15
        level: low
    i2c:
      - sda_pin: GPIO21
        scl_pin: GPIO22
        possible_peripherals:
          - I2C0
          - I2C1
    uarts:
      - tx_pin: GPIO1
        rx_pin: GPIO3
        possible_peripherals: [UART0, UART1, UART2]
        host_facing: true

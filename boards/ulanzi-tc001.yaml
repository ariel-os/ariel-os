version: 0.4.1
targets:
  ulanzi-tc001:
    chip: esp32-wroom-32d
    buttons:
      # button0
      - pin: GPIO26
        active: low
        aliases:
          - left
      # button1
      - pin: GPIO27
        active: low
        aliases:
          - middle
      # button2
      - pin: GPIO14
        active: low
        aliases:
          - right
    quirks:
      - type: set_pin
        description: turn off buzzer
        pin: GPIO15
        level: low
    i2c:
      - sda_pin: GPIO21
        scl_pin: GPIO22
        possible_peripherals:
          - I2C0
          - I2C1
    uarts:
      - tx_pin: GPIO1
        rx_pin: GPIO3
        possible_peripherals: [UART0]
        host_facing: true

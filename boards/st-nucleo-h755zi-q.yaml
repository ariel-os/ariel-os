version: 0.5.0
targets:
  # Pinout from <https://www.st.com/en/evaluation-tools/nucleo-h755zi-q.html#cad-resources>
  st-nucleo-h755zi-q:
    chip: stm32h755zi
    flags:
      - has_ethernet_stm32
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB0
        aliases:
          - LD1
        color: green
        active: high
      # led1
      - pin: PE1
        aliases:
          - LD2
        color: yellow
        active: high
      # led2
      - pin: PB14
        aliases:
          - LD3
        color: red
        active: high
    switches:
      # button0
      - pins: PC13
        active: low
        resistors: pullup
        aliases:
          - B1
          - USER
    uarts:
      - aliases:
          - VCP
        tx_pin: PD8
        rx_pin: PD9
        possible_peripherals: [USART3]
        host_facing: true

version: 0.5.0
targets:
  # Pinout for the switches and LEDs from the schematic found at <https://www.st.com/en/evaluation-tools/b-l475e-iot01a.html#cad-resources>
  st-b-l475e-iot01a:
    chip: stm32l475vg
    flags:
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
        aliases:
          - LD1
        color: green
      # led1
      - pin: PB14
        aliases:
          - LD2
        color: green
    switches:
      # button0
      - pins: PC13
        resistors: pullup
        active: low
        aliases:
          - B2
          - USER
          - WAKE_UP
          - BUTTON_EXTI13
    i2c:
      # These pins have strong pull-ups suitable for I2C.
      - sda_pin: PB9
        scl_pin: PB8
        possible_peripherals:
          - I2C1
        aliases:
          - ArduinoI2c
      - sda_pin: PB11
        scl_pin: PB10
        possible_peripherals:
          - I2C2
    uarts:
      - aliases:
          - VCP
        tx_pin: PB6
        rx_pin: PB7
        possible_peripherals: [USART1]
        host_facing: true

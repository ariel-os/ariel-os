version: 0.5.0
targets:
  espressif-esp8684-devkitc-02:
    # Schematic <https://dl.espressif.com/dl/schematics/esp8684-devkitc-02-schematics_V1.0.pdf>
    chip: esp8684-wroom-02c-h4
    buttons:
      # button0 (BOOT)
      - pin: GPIO9
        # The NPN transistor pulls to DTR (an active-low signal) when RTS is
        # high (also an active-low signal); however when RTS is low the pin
        # is left floating, which still calls for enabling the internal pull-up.
        resistor: none
        active: low
        aliases:
          - SW1
    leds:
      # led0 (RGB red channel)
      - pin: GPIO0
        color: red
        active: high
        aliases:
          - D6
    uarts:
      - tx_pin: GPIO20
        rx_pin: GPIO19
        possible_peripherals: [UART0, UART1]
        host_facing: true

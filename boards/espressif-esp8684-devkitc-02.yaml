version: 0.4.1
targets:
  espressif-esp8684-devkitc-02:
    chip: esp8684-wroom-02c-h4
    buttons:
      # button0 (BOOT)
      - pin: GPIO9
        active: low
    leds:
      # led0 (RGB red channel)
      - pin: GPIO0
        color: red
        active: high
    uarts:
      - tx_pin: GPIO20
        rx_pin: GPIO19
        possible_peripherals: [UART0]
        host_facing: true

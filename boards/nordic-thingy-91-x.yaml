version: 0.4.0
targets:
  nordic-thingy-91-x-nrf9151:
    chip: nrf9151
    leds:
      # led0
      - pin: P0_29
        color: red
      # led1
      - pin: P0_31
        color: green
      # led2
      - pin: P0_30
        color: blue
    buttons:
      # button0
      - pin: P0_26
    uarts:
      - aliases:
          - VCOM0
        # Note that the vendor's schematic file is labeled from the nRF53's perspective
        tx_pin: P0_01
        rx_pin: P0_00
        # FIXME: Is this exhaustive? (Seems those are all we have in Ariel right now)
        possible_peripherals: [SERIAL3]
        host_facing: true
      # Pins are correct, but SERIAL3 is already taken
      # - aliases:
      #   - VCOM1
      #   tx_pin: P0_05
      #   rx_pin: P0_04
      #   # FIXME: Is this exhaustive? (Seems those are all we have in Ariel right now)
      #   possible_peripherals: [SERIAL3]
      #   host_facing: true

  nordic-thingy-91-x-nrf5340-app:
    chip: nrf5340-app
    flags:
      - has_usb_device_port
    leds:
      # led0
      - pin: P0_14
        color: red
      # led1
      - pin: P0_26
        color: green
      # led2
      - pin: P0_15
        color: blue
    buttons:
      # button0
      - pin: P0_24

  nordic-thingy-91-x-nrf5340-net:
    chip: nrf5340-net
    flags:
      - has_nrf_ble

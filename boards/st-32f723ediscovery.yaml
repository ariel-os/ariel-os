version: 0.5.0
targets:
  st-32f723ediscovery:
    chip: stm32f723ie
    flags:
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
        color: blue
        active: high
        aliases:
          - LD1
      # led1
      - pin: PA7
        color: red
        active: high
        aliases:
          - LD5
      # led2
      - pin: PB1
        color: green
        active: high
        aliases:
          - LD6
    buttons:
      # button0
      - pin: PA0
        resistor: none
        active: high
    i2c:
      - sda_pin: PH5
        scl_pin: PH4
        possible_peripherals:
          - I2C2

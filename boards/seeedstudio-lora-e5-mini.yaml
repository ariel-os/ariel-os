version: 0.4.1
targets:
  seeedstudio-lora-e5-mini:
    chip: stm32wle5jc
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB5
        aliases:
          - LD1
        color: red
    buttons:
      # button0
      - pin: PB13
    uarts:
      - aliases:
          - VCP
        tx_pin: PB6
        rx_pin: PB7
        possible_peripherals: [USART1]
        host_facing: true

version: 0.5.0
targets:
  bbc-microbit-v2:
    chip: nrf52833
    switches:
      # button0
      - pins: P0_14
        resistors: pullup
        active: low
        aliases:
          - BTN_A # Name on the schematic
      # button1
      - pins: P0_23
        resistors: pullup
        active: low
        aliases:
          - BTN_B # Name on the schematic
    i2c:
      - sda_pin: P0_16
        scl_pin: P0_08
        possible_peripherals:
          - TWISPI0
          - TWISPI1
    uarts:
      - aliases:
          - UART_INT
        # According to https://tech.microbit.org/hardware/schematic/, which
        # explains that pins are labeled from the host point of view.
        rx_pin: P1_08 # UART_INT_TX
        tx_pin: P0_06 # UART_INT_RX
        possible_peripherals: [UARTE0, UARTE1]
        host_facing: true

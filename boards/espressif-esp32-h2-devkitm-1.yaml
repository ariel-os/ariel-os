version: 0.4.1
targets:
  espressif-esp32-h2-devkitm-1:
    chip: esp32-h2-mini-1-h4s
    flags:
      - has_usb_cdc_acm_port
    buttons:
      # button0 (BOOT)
      - pin: GPIO9
        active: low
    uarts:
      - tx_pin: GPIO24
        rx_pin: GPIO23
        possible_peripherals: [UART0]
        host_facing: true

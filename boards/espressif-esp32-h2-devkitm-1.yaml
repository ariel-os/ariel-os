version: 0.5.0
targets:
  espressif-esp32-h2-devkitm-1:
    # Schematic <https://dl.espressif.com/dl/schematics/esp32-h2-devkitm-1_v1.3_schematics.pdf>
    chip: esp32-h2-mini-1-h4s
    flags:
      - has_usb_cdc_acm_port
    buttons:
      # button0 (BOOT)
      - pin: GPIO9
        # The NPN transistor pulls to DTR (an active-low signal) when RTS is
        # high (also an active-low signal); however when RTS is low the pin
        # is left floating, which still calls for enabling the internal pull-up.
        resistor: none
        active: low
        aliases:
          - BOOT
          - SW1
    uarts:
      - tx_pin: GPIO24
        rx_pin: GPIO23
        possible_peripherals: [UART0, UART1]
        host_facing: true

version: 0.5.0
targets:
  decawave-dwm1001-dev:
    chip: nrf52832
    leds:
      # led0
      - pin: P0_14
        aliases:
          - D12
          - GPIO14
        color: red
        active: low
      # led1
      - pin: P0_30
        aliases:
          - D9
        color: green
        active: low
      # led2
      - pin: P0_22
        aliases:
          - D11
        color: red
        active: low
      # led3
      - pin: P0_31
        aliases:
          - D10
        color: blue
        active: low
    switches:
      # button0
      - pins: P0_02
        aliases:
          - BT_WAKE_UP
        active: low
        resistors: none # Couldn't find a proper schematic
    uarts:
      - tx_pin: P0_05
        rx_pin: P0_11
        possible_peripherals: [UARTE0]
        host_facing: true

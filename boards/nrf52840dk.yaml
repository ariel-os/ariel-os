version: 0.5.0
targets:
  # Pinout for the switches and LEDs from https://docs.nordicsemi.com/r/bundle/ug_nrf52840_dk/page/ug/dk/hw_buttons_leds.html
  nrf52840dk:
    chip: nrf52840
    flags:
      - has_usb_device_port
    leds:
      # led0
      - color: green
        pin: P0_13
        active: low
      # led1
      - color: green
        pin: P0_14
        active: low
      # led2
      - color: green
        pin: P0_15
        active: low
      # led3
      - color: green
        pin: P0_16
        active: low
    switches:
      # button0
      - pins: P0_11
        active: low
        resistors: none
        aliases:
          - SW1
      # button1
      - pins: P0_12
        active: low
        resistors: none
        aliases:
          - SW2
      # button2
      - pins: P0_24
        active: low
        resistors: none
        aliases:
          - SW3
      # button3
      - pins: P0_25
        active: low
        resistors: none
        aliases:
          - SW4
    i2c:
      # Only available when a shield is inserted.
      - sda_pin: P0_26
        scl_pin: P0_27
        possible_peripherals:
          - TWISPI0
          - TWISPI1
    uarts:
      - aliases:
          - VCOM0
        tx_pin: P0_06
        rx_pin: P0_08
        rts_pin: P0_05
        cts_pin: P0_07
        possible_peripherals: [UARTE0, UARTE1]
        host_facing: true

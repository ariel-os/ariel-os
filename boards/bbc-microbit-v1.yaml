version: 0.5.0
targets:
  bbc-microbit-v1:
    chip: nrf51822-xxaa
    switches:
      # button0
      - pins: P0_17
        resistors: pullup
        active: low
        aliases:
          - BTN_A # Name on the schematic
      # button1
      - pins: P0_26
        resistors: pullup
        active: low
        aliases:
          - BTN_B # Name on the schematic

version: 0.4.1
targets:
  nrf9160dk-nrf9160:
    chip: nrf9160
    leds:
      # led0
      - pin: P0_02
    buttons:
      # button0
      - pin: P0_06
    i2c:
      # Enabled by the companion nRF5280 MCU.
      # When running custom software, the I/O expander can be enabled by setting the `IOEXP_EN` P0_14 pin high.
      - sda_pin: P0_30
        scl_pin: P0_31
        possible_peripherals:
          - SERIAL0
          - SERIAL1
    uarts:
      - aliases:
          - VCOM0
        tx_pin: P0_29
        rx_pin: P0_28
        rts_pin: P0_27
        cts_pin: P0_26
        possible_peripherals: [SERIAL3]
        host_facing: true
      # TODO: enable when multiple peripherals can be used for UART in Ariel OS.
      # - aliases:
      #     - VCOM2
      #   tx_pin: P0_01
      #   rx_pin: P0_00
      #   rts_pin: P0_15
      #   cts_pin: P0_14
      #   possible_peripherals: [SERIAL3]
      #   host_facing: true

version: 0.5.0
targets:
  # Pinout for the switches and LEDs from <https://docs.nordicsemi.com/r/bundle/ug_nrf9160_dk/page/ug/nrf91_dk/hw_description/hw_buttons_leds.html>
  nrf9160dk-nrf9160:
    chip: nrf9160
    leds:
      # led0
      - pin: P0_02
        active: high
        aliases:
          - LED1
      # led0
      - pin: P0_03
        active: high
        aliases:
          - LED2
      - pin: P0_04
        active: high
        aliases:
          - LED3
      - pin: P0_05
        active: high
        aliases:
          - LED4
    switches:
      # button0
      - pins: P0_06
        resistors: none
        active: low
        aliases:
          - SW3
          - BUTTON1
      - pins: P0_07
        resistors: none
        active: low
        aliases:
          - SW4
          - BUTTON2
      - pins: P0_08
        resistors: none
        active: low
        aliases:
          - SW1
          - SWITCH1
      - pins: P0_09
        resistors: none
        active: low
        aliases:
          - SW2
          - SWITCH2
    i2c:
      # Enabled by the companion nRF5280 MCU.
      # When running custom software, the I/O expander can be enabled by setting the `IOEXP_EN` P0_14 pin high.
      - sda_pin: P0_30
        scl_pin: P0_31
        possible_peripherals:
          - SERIAL0
          - SERIAL1
    uarts:
      - aliases:
          - VCOM0
        tx_pin: P0_29
        rx_pin: P0_28
        rts_pin: P0_27
        cts_pin: P0_26
        possible_peripherals: [SERIAL3]
        host_facing: true
      # TODO: enable when multiple peripherals can be used for UART in Ariel OS.
      # - aliases:
      #     - VCOM2
      #   tx_pin: P0_01
      #   rx_pin: P0_00
      #   rts_pin: P0_14
      #   cts_pin: P0_15
      #   possible_peripherals: [SERIAL3]
      #   host_facing: true

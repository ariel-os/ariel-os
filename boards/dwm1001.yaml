version: 0.4.0
targets:
  dwm1001:
    chip: nrf52832
    leds:
      # led0
      - pin: P0_14
        aliases:
          - D12
          - GPIO14
        color: red
        active: low
      # led1
      - pin: P0_30
        aliases:
          - D9
        color: green
        active: low
      # led2
      - pin: P0_22
        aliases:
          - D11
        color: red
        active: low
      # led3
      - pin: P0_31
        aliases:
          - D10
        color: blue
        active: low
    buttons:
      # button0
      - pin: P0_02
        aliases:
          - BT_WAKE_UP
        active: low

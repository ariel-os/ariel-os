version: 0.5.0
targets:
  # Pinout for the switch and LEDs from <https://files.seeedstudio.com/wiki/SeeedStudio-XIAO-ESP32S3/res/XIAO_ESP32S3_SCH_v1.2.pdf>
  seeedstudio-xiao-esp32-s3:
    chip: esp32s3r8
    flags:
      - has_ble_esp
      - has_usb_cdc_acm_port
      - has_usb_device_port
    leds:
      - pin: GPIO21
        color: yellow
        active: low
        aliases:
          - USER_LED
    switches:
      - pins: GPIO0
        active: low
        resistors: pullup
        aliases:
          - BOOT
          - K2

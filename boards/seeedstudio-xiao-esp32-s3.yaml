version: 0.4.1
targets:
  seeedstudio-xiao-esp32-s3:
    chip: esp32s3r8
    ariel:
      global_env:
        CHIP_NVM_SIZE_BYTES: $(8192 * 1024)
    flags:
      - has_ble_esp
      - has_usb_cdc_acm_port
      - has_usb_device_port
    leds:
      - pin: GPIO21
        color: yellow
        active: low
        aliases:
          - USER_LED
    buttons:
      - pin: GPIO0
        active: low
        aliases:
          - BOOT

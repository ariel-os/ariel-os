version: 0.5.0
targets:
  # Pinout for the buttons and LEDs from <https://www.st.com/resource/en/user_manual/um2115-discovery-kit-for-lorawan-sigfox-and-lpwan-protocols-with-stm32l0-stmicroelectronics.pdf>
  st-b-l072z-lrwan1:
    chip: stm32l072cz
    # The USB user connector (CN11) is not connected to the MCU by default: solder bridges SB15
    # and SB16 need to be closed to connect USB D- (PA11) and D+ (PA12).
    # flags:
    #   - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB5
        color: green
        active: high
        aliases:
          - LD1
      # led1
      - pin: PA5
        color: red
        active: high
        aliases:
          - LD2
      # led2
      - pin: PB6
        color: blue
        active: high
        aliases:
          - LD3
      # led3
      - pin: PB7
        color: red
        active: high
        aliases:
          - LD4
    buttons:
      # button0
      - pin: PB2
        resistor: pullup
        active: low
        aliases:
          - USER
          - B1
    i2c:
      # SDA/D14 and SCL/D15 on the Arduino connector
      - sda_pin: PB9
        scl_pin: PB8
        possible_peripherals:
          - I2C1
        aliases:
          - ArduinoI2c
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA3
        # TODO: add LPUART1 when supported by Ariel OS.
        possible_peripherals: [USART2]
        host_facing: true

version: 0.5.0
targets:
  # Pinout from <https://www.st.com/resource/en/schematic_pack/mb1355-wb55rg-c02_schematic.pdf>
  st-nucleo-wb55:
    chip: stm32wb55rg
    flags:
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB5
        color: blue
        aliases:
          - LED1
      # led1
      - pin: PB0
        color: green
        aliases:
          - LED2
      # led2
      - pin: PB1
        color: red
        aliases:
          - LED3
    switches:
      # button0
      - pins: PC4 # Can be PC13 if SB48 is closed and SB47 is opened
        resistors: none
        active: low
        aliases:
          - SW1
      # button1
      - pins: PD0
        resistors: none
        active: low
        aliases:
          - SW2
      # button2
      - pins: PD1
        resistors: none
        active: low
        aliases:
          - SW3
    uarts:
      # Jumpers must be on.
      - aliases:
          - VCP
        tx_pin: PB6
        rx_pin: PB7
        possible_peripherals: [USART1]
        host_facing: true

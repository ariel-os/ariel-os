version: 0.4.1
targets:
  st-nucleo-wb55:
    chip: stm32wb55rg
    flags:
      - has_usb_device_port
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB5
        color: blue
        aliases:
          - LED1
      # led1
      - pin: PB0
        color: green
        aliases:
          - LED2
      # led2
      - pin: PB1
        color: red
        aliases:
          - LED3
    buttons:
      # button0
      - pin: PC4
        aliases:
          - SW1
      # button1
      - pin: PD0
        aliases:
          - SW2
      # button2
      - pin: PD1
        aliases:
          - SW3
    uarts:
      - aliases:
          - VCP
        tx_pin: PB6
        rx_pin: PB7
        possible_peripherals: [USART1]
        host_facing: true

version: 0.5.0
targets:
  # Schematic found in appendix B of <https://pip-assets.raspberrypi.com/categories/1005-raspberry-pi-pico-2/documents/RP-008299-DS-3-pico-2-datasheet.pdf>
  rpi-pico2:
    chip: rp2350a
    flags:
      - has_usb_device_port
    ariel:
      global_env:
        CHIP_NVM_SIZE_BYTES: $(4096 * 1024)
    leds:
      # led0
      - pin: PIN_25
        color: green
        active: high

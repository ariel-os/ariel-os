version: 0.5.0
targets:
  # Pinout for the buttons and LEDs from the files found at <https://www.st.com/en/evaluation-tools/nucleo-f767zi.html#cad-resources>
  st-nucleo-f767zi:
    chip: stm32f767zi
    flags:
      - has_ethernet_stm32
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB0
        color: green
        active: high
        aliases:
          - LD1
      # led1
      - pin: PB7
        color: blue
        active: high
        aliases:
          - LD2
      # led2
      - pin: PB14
        color: red
        active: high
        aliases:
          - LD3
    buttons:
      # button0
      - pin: PC13
        resistor: pullup
        active: low
        aliases:
          - B1
          - USER
    uarts:
      - aliases:
          - VCP
        tx_pin: PD8
        rx_pin: PD9
        possible_peripherals: [USART3]
        host_facing: true

version: 0.5.0
targets:
  # Pinout for the buttons and LEDs from <https://github.com/particle-iot/xenon/blob/master/pdfs/xenon-v1.00-schematic.pdf>
  particle-xenon:
    chip: nrf52840
    flags:
      - has_usb_device_port
    leds:
      # led0
      - color: blue
        pin: P1_12
        aliases:
          - D7
        active: high
    buttons:
      # button0
      - pin: P0_11
        resistor: none
        active: low
        aliases:
          - MODE

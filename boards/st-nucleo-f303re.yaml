version: 0.5.0
targets:
  # Pinout for the switches and LEDs from <https://www.st.com/resource/en/schematic_pack/mb1136-default-c03_schematic.pdf>
  st-nucleo-f303re:
    chip: stm32f303re
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PA5
    switches:
      # button0
      - pins: PC13
        active: low
        resistors: pullup
        aliases:
          - B1
          - USER
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA3
        possible_peripherals: [USART2]
        host_facing: true

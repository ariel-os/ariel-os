version: 0.4.1
targets:
  rpi-pico-w:
    chip: rp2040
    flags:
      - has_ble_cyw43
      - has_wifi_cyw43
      - has_usb_device_port
    ariel:
      global_env:
        CHIP_NVM_SIZE_BYTES: $(2048 * 1024)
    uarts:
      - tx_pin: PIN_0
        rx_pin: PIN_1
        possible_peripherals: [UART0]
        host_facing: true

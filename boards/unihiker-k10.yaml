version: 0.5.0
targets:
  # Pinout from https://www.unihiker.com/wiki/K10/HardwareReference/img/hardwarereference_onboard/UnihikerK10Schematic.pdf
  unihiker-k10:
    chip: esp32-s3-wroom-1
    flags:
      - has_usb_cdc_acm_port
      - has_usb_device_port
    switches:
      # button0
      - pins: GPIO0
        active: low
        resistors: none
        aliases:
          - BOOT
          - K1
    i2c:
      - sda_pin: GPIO47
        scl_pin: GPIO48
        possible_peripherals:
          - I2C0
          - I2C1

version: 0.5.0
targets:
  # Pinout from <https://www.st.com/resource/en/user_manual/um1956-stm32-nucleo32-boards-mb1180-stmicroelectronics.pdf>
  st-nucleo-f042k6:
    chip: stm32f042k6
    ariel:
      swi: WWDG
    leds:
      # led0
      - pin: PB3
    uarts:
      - aliases:
          - VCP
        tx_pin: PA2
        rx_pin: PA15
        possible_peripherals: [USART2]
        host_facing: true

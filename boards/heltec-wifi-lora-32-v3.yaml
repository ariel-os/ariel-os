version: 0.4.0
targets:
  heltec-wifi-lora-32-v3:
    chip: esp32s3fx8
    leds:
      # led0
      - pin: GPIO35
        color: white
        active: high
    buttons:
      # button0
      - pin: GPIO0
        active: low
    i2c:
      - sda_pin: GPIO17
        scl_pin: GPIO18
        possible_peripherals:
          - I2C1

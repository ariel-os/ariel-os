version: 0.5.0
targets:
  heltec-wifi-lora-32-v3:
    # Schematic <https://resource.heltec.cn/download/WiFi_LoRa_32_V3/HTIT-WB32LA(F)_V3_Schematic_Diagram.pdf>
    chip: esp32s3fx8
    leds:
      # led0
      - pin: GPIO35
        color: white
        active: high
        aliases:
          - LED2
    switches:
      # button0
      - pins: GPIO0
        active: low
        resistors: none # Couldn't find on the schematic
        aliases:
          - USER
    i2c:
      - sda_pin: GPIO17
        scl_pin: GPIO18
        possible_peripherals:
          - I2C1
          - I2C0
    uarts:
      - tx_pin: GPIO43
        rx_pin: GPIO44
        possible_peripherals: [UART0, UART1, UART2]
        host_facing: true

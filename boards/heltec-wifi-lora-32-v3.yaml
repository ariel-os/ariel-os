version: 0.4.1
targets:
  heltec-wifi-lora-32-v3:
    chip: esp32s3fx8
    leds:
      # led0
      - pin: GPIO35
        color: white
        active: high
    buttons:
      # button0
      - pin: GPIO0
        active: low
    i2c:
      - sda_pin: GPIO17
        scl_pin: GPIO18
        possible_peripherals:
          - I2C1
          - I2C0
    uarts:
      - tx_pin: GPIO43
        rx_pin: GPIO44
        possible_peripherals: [UART0]
        host_facing: true

version: 0.5.0
targets:
  nrf54l15dk-app:
    # Pinout for buttons and LED from <https://docs.nordicsemi.com/viewer/book-attachment/~YKv8eslZtFFw36ARogCoQ/wl2RIDv5cuDL35WDb~LGlQ-~YKv8eslZtFFw36ARogCoQ>
    chip: nrf54l15-app
    leds:
      # led0
      - color: green
        pin: P2_09
        active: high
      # led1
      - color: green
        pin: P1_10
        active: high
      # led2
      - color: green
        pin: P2_07
        active: high
      # led3
      - color: green
        pin: P1_14
        active: high

    buttons:
      # button0
      - pin: P1_13
        resistor: none
        active: low
        aliases:
          - SW2
          - Button0
      # button1
      - pin: P1_09
        resistor: none
        active: low
        aliases:
          - SW3
          - Button1
      # button2
      - pin: P1_08
        resistor: none
        active: low
        aliases:
          - SW5
          - Button2
      # button3
      - pin: P0_04
        resistor: none
        active: low
        aliases:
          - SW6
          - Button3

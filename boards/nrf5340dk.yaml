version: 0.4.1
targets:
  nrf5340dk-app:
    chip: nrf5340-app
    flags:
      - has_usb_device_port
    leds:
      # led0
      - color: green
        pin: P0_28
        active: low
      # led1
      - color: green
        pin: P0_29
        active: low
      # led2
      - color: green
        pin: P0_30
        active: low
      # led3
      - color: green
        pin: P0_31

    buttons:
      # button0
      - pin: P0_23
        active: low
      # button1
      - pin: P0_24
        active: low
      # button2
      - pin: P0_08
        active: low
      # button3
      - pin: P0_09
        active: low

    i2c:
      # Only available when a shield is inserted.
      - sda_pin: P1_02
        scl_pin: P1_03
        possible_peripherals:
          - SERIAL0
          - SERIAL1

    uarts:
      - aliases:
          - VCOM0
        tx_pin: P1_01
        rx_pin: P1_00
        rts_pin: P0_11
        cts_pin: P0_10
        possible_peripherals: [SERIAL3]
        host_facing: true
      # TODO: enable when multiple peripherals can be used for UART in Ariel OS.
      # - aliases:
      #     # There is no VCOM1.
      #     - VCOM2
      #   tx_pin: P0_20
      #   rx_pin: P0_22
      #   rts_pin: P0_19
      #   cts_pin: P0_21
      #   possible_peripherals: [SERIAL3]
      #   host_facing: true

  nrf5340dk-net:
    chip: nrf5340-net

version: 0.5.0
targets:
  espressif-esp32-s2-devkitc-1:
    # Schematic <https://dl.espressif.com/dl/schematics/esp-idf/SCH_ESP32-S2-DEVKITC-1_V1_20220817.pdf>
    chip: esp32-s2-solo-2
    flags:
      - has_usb_device_port
    switches:
      # button0
      - pins: GPIO0
        active: low
        resistors: none
        aliases:
          - SW1
    uarts:
      - tx_pin: GPIO43
        rx_pin: GPIO44
        possible_peripherals: [UART0, UART1]
        host_facing: true

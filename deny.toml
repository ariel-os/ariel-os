[graph]
# If true, metadata will be collected with `--all-features`. Note that this can't
# be toggled off if true, if you want to conditionally enable `--all-features` it
# is recommended to pass `--all-features` on the cmd line instead
all-features = false

# make cargo-deny ignore these:
exclude = ["nrf-pac"] # currently unlicensed

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# Check dev-dependencies as well
include-dev = true
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
  "0BSD",
  "Apache-2.0",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # We may allow other licenses as necessary.
]
# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = [
  # Each entry is the crate and version constraint, and its specific allow
  # list
  { allow = ["BSL-1.0"], crate = "lhash" },
  # OSI-approved: https://opensource.org/license/blue-oak-model-license
  { allow = ["BlueOak-1.0.0"], crate = "minicbor" },
  { allow = ["BlueOak-1.0.0"], crate = "minicbor-derive" },
  { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[bans]
deny = [
  { crate = "proc-macro-error", reason = "unmaintained: https://rustsec.org/advisories/RUSTSEC-2024-0370" },
  { crate = "serde_yml", reason = "unsound and unmaintained" },
  # Weak bans: the bans below are considered "weak": they may be disabled
  # (ideally only transiently) for a good reason.
  # There is usually no good reasons for CLI argument parsing crates to be part
  # of the dependency tree, even just as build-dependencies or dev-dependencies,
  # as Ariel OS only contains libraries.
  # Sometimes it may be needed to go upstream to feature-gate them.
  { crate = "argh", reason = "CLI argument parsing crate" },
  { crate = "clap", reason = "CLI argument parsing crate" },
  { crate = "lexopt", reason = "CLI argument parsing crate" },
  { crate = "pico-args", reason = "CLI argument parsing crate", wrappers = [
    "lalrpop", # This exception is only needed for `pio-parser`.
  ] },
  # We favor Jiff over other time-related crates, as the ecosystem is moving
  # towards it, and to avoid dependency duplication.
  # `chrono` is now soft-deprecated: <https://github.com/chronotope/chrono/issues/1768>.
  { crate = "chrono", use-instead = "jiff", reason = "avoids duplication of time-related crates", wrappers = [
    "cbor-edn",
    "cbor-diag",
  ] },
  { crate = "time", use-instead = "jiff", reason = "avoids duplication of time-related crates", wrappers = [
    "der", # Only needed for `embedded-tls` until removed upstream.
  ] },
]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "deny"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "deny"
# List of URLs for allowed Git repositories
allow-git = [
  "https://github.com/hacspec/hax",
  "https://gitlab.com/oscore/liboscore",
  "https://github.com/seanmonstar/try-lock",
  "https://gitlab.com/etonomy/riot-module-examples",
  # while https://github.com/twittner/minicbor/pull/9 is open
  "https://github.com/chrysn-pull-requests/minicbor",
  # for the thermometer example
  "https://codeberg.org/AudaciousAxiom/stm32-lcd-driver",
  # while https://github.com/ariel-os/dress-up/pull/25 is open
  "https://github.com/anlavandier/dress-up/",
]

[sources.allow-org]
# github.com organizations to allow git sources for
github = ["ariel-os", "embassy-rs"]

[package]
name = "suit-device-update"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ariel-os = { path = "../../src/ariel-os", features = [
  "device-update",
  "external-interrupts",
] }
ariel-os-boards = { path = "../../src/ariel-os-boards" }
ariel-os-suit = { path = "../../src/ariel-os-suit", features = ["defmt"] }

cose-nostd = { git = "https://codeberg.org/COLORADIO-Project/cose-nostd.git", rev = "59053ef78916ff038858b45fdd73ed9389c303f1", features = [
  "p-256",
  "sign1",
  "verify",
] }

dress-up = { git = "https://github.com/anlavandier/dress-up/", rev = "a9d67a36ee7873053a5588dcc0877c439301a480", features = [
  "async",
], default-features = false }

[features]
coap = ["ariel-os-suit/coap"]
http = ["ariel-os-suit/http"]

[lints]
workspace = true
